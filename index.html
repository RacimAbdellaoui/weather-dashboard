<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Weather Dashboard</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="app">
      <header class="topbar">
        <h1>Weather Dashboard</h1>
        <form id="search-form" class="search-form">
          <input
            id="city-input"
            type="text"
            placeholder="Rechercher une ville..."
            aria-label="Rechercher une ville"
          />
          <button type="submit">Rechercher</button>
        </form>
      </header>

      <main id="weather-container" class="weather-container hidden">
        <section class="current-card">
          <div class="city-row">
            <div>
              <p id="city-name" class="city-name"></p>
              <p id="last-updated" class="last-updated"></p>
            </div>
            <div id="weather-icon" class="weather-icon" aria-label="Weather icon"></div>
          </div>

          <div class="temp-row">
            <div id="temperature" class="temperature"></div>
            <div class="condition-block">
              <p id="condition" class="condition"></p>
              <p id="feels-like" class="feels-like"></p>
            </div>
          </div>

          <div class="stats-grid">
            <div class="stat">
              <span>Humidité</span>
              <strong id="humidity"></strong>
            </div>
            <div class="stat">
              <span>Vent</span>
              <strong id="wind"></strong>
            </div>
            <div class="stat">
              <span>Lever du soleil</span>
              <strong id="sunrise"></strong>
            </div>
            <div class="stat">
              <span>Coucher du soleil</span>
              <strong id="sunset"></strong>
            </div>
          </div>
        </section>

        <section class="forecast">
          <h2>5 prochains jours</h2>
          <div id="forecast-list" class="forecast-list"></div>
        </section>
      </main>

      <div id="error-message" class="error-message hidden"></div>
    </div>

    <script src="script.js"></script>
  </body>
</html>
